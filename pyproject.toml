[project]
name = "shiny-venipede"
version = "0.1.0"
description = "A metronome battle bot for Pokemon Showdown"
readme = "README.md"
authors = [
    { name = "panda", email = "pandalinoox@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "poke-env>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.13",
]

[project.scripts]
venipede = "shiny_venipede.__main__:main"

[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/e2e"
]
asyncio_mode = "auto"
addopts = "-m 'not e2e'"
markers = [
    "e2e: tests that require a running showdown server or ladder connection",
]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
search-path = ["."]
preset="strict"
